<!doctype html>
<html lang="en" dir="ltr" data-theme-mode="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منارة — منصة تعليمية متكاملة للمؤسسات التعليمية" />
    <title>منارة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
    <script>
      (() => {
        const root = document.documentElement;
        let mode = 'system';
        try {
          const stored = localStorage.getItem('manara.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored;
        } catch {}
        let prefersDark = false;
        try {
          prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        } catch {}
        const resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        root.classList.toggle('dark', resolved === 'dark');
        root.dataset.theme = resolved;
        root.dataset.themeMode = mode;
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">الانتقال إلى المحتوى الرئيسي / Skip to main content</a>
    <div id="root" tabindex="-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
